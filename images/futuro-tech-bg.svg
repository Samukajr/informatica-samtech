<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Fundo futurista de tecnologia e robotica">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030711"/>
      <stop offset="55%" stop-color="#07172a"/>
      <stop offset="100%" stop-color="#0d2340"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#27e1ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#27e1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.84" cy="0.28" r="0.45">
      <stop offset="0%" stop-color="#2e7bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2e7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ce9ff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27e1ff" stop-opacity="0.0"/>
      <stop offset="45%" stop-color="#27e1ff" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#49ffb3" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#49ffb3" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.5"/>

  <g opacity="0.7">
    <path d="M140 840 C420 760, 620 840, 900 760" stroke="url(#lineGrad)" stroke-width="3" fill="none"/>
    <path d="M820 250 C1060 300, 1320 230, 1700 360" stroke="url(#lineGrad)" stroke-width="2.6" fill="none"/>
    <path d="M200 300 C520 420, 760 320, 1080 430" stroke="url(#lineGrad)" stroke-width="2.2" fill="none"/>
  </g>

  <g fill="none" stroke="#85edff" stroke-opacity="0.62">
    <circle cx="364" cy="710" r="8"/>
    <circle cx="364" cy="710" r="24" opacity="0.5"/>
    <circle cx="980" cy="610" r="8"/>
    <circle cx="980" cy="610" r="26" opacity="0.45"/>
    <circle cx="1450" cy="430" r="8"/>
    <circle cx="1450" cy="430" r="22" opacity="0.4"/>
  </g>

  <g transform="translate(1230, 210)" opacity="0.32" stroke="#8deeff" stroke-width="2" fill="none">
    <rect x="40" y="70" width="180" height="220" rx="24"/>
    <rect x="78" y="100" width="104" height="76" rx="14"/>
    <circle cx="110" cy="136" r="8"/>
    <circle cx="150" cy="136" r="8"/>
    <path d="M100 166 Q130 186 160 166"/>
    <path d="M40 140 H0"/>
    <path d="M220 140 H260"/>
    <path d="M100 290 V340"/>
    <path d="M160 290 V340"/>
  </g>

  <g opacity="0.35" filter="url(#softBlur)">
    <circle cx="1240" cy="320" r="40" fill="#27e1ff"/>
    <circle cx="420" cy="760" r="44" fill="#49ffb3"/>
    <circle cx="980" cy="620" r="38" fill="#2e7bff"/>
  </g>

  <g filter="url(#bigGlow)" opacity="0.35">
    <ellipse cx="960" cy="920" rx="500" ry="80" fill="#1ae2ff"/>
  </g>
</svg>
